<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Goal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 Income Goal Planner</h1>
    <p class="subtitle">Plan exactly how you will hit your money goal</p>

    <div class="card">
      <label>What is your income goal? (₦)</label>
      <input type="number" id="goal" placeholder="e.g. 2000000">

      <label>How many months to achieve it?</label>
      <input type="number" id="months" placeholder="e.g. 4">

      <div class="streams-section">
        <p class="streams-title">Add your income streams</p>
        <p class="streams-sub">What will you do to make this money?</p>

        <div id="streams-list">
          <div class="stream-item">
            <select class="stream-type">
              <option value="">Select type</option>
              <option value="Digital Product">Digital Product</option>
              <option value="Freelance Service">Freelance Service</option>
              <option value="Coaching">Coaching</option>
              <option value="Affiliate Marketing">Affiliate Marketing</option>
              <option value="Content Creation">Content Creation</option>
              <option value="Physical Product">Physical Product</option>
              <option value="Other">Other</option>
            </select>
            <input type="number" class="stream-price" placeholder="Price per sale (₦)">
            <button class="remove-btn" onclick="removeStream(this)">✕</button>
          </div>
        </div>

        <button class="add-btn" onclick="addStream()">+ Add Another Stream</button>
      </div>

      <button class="calculate-btn" onclick="calculate()">Plan My Income 🚀</button>
    </div>

    <div class="result" id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
